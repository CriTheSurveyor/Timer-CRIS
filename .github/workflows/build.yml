name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: echo "$KEYSTORE_B64" | base64 -d > app/timer.p12
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
      - run: gradle testDebugUnitTest assembleDebug
        env: { KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}" }
      - uses: actions/upload-artifact@v4
        with: { name: tabata-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - run: cp app/build/outputs/apk/debug/app-debug.apk timer-cris.apk
      # every main build becomes the "latest" release the app checks for updates
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: timer-cris.apk
